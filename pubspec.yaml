name: setup_my_flutter
description: A Dart CLI tool to scaffold Flutter projects with Feature-First architecture.
version: 1.0.0
repository: https://github.com/shandikadav/smf

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  args: ^2.6.0
  mason: ^0.1.0
  mason_logger: ^0.3.1
  yaml_edit: ^2.2.1
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.8
  mocktail: ^1.0.4

executables:
  setup_my_flutter: setup_my_flutter
  smf: main
  create: create
